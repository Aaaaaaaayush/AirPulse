apiVersion: apps/v1
kind: Deployment
metadata:
  name: airpulse-serving
  namespace: default
  labels:
    app.kubernetes.io/name: airpulse
    app.kubernetes.io/component: serving
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: airpulse-serving
  template:
    metadata:
      labels:
        app: airpulse-serving
    spec:
      containers:
        - name: airpulse-serving
          image: ghcr.io/aaaaaaaayush/airpulse-serving:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: airpulse-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
