version: '3.8'

services:
  airpulse-serving:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: airpulse-serving
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    restart: unless-stopped
